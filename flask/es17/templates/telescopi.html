<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telescopi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Telescopi</h1>
        <div class="table-responsive mb-4">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Posizione</th>
                        <th>Apertura</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for telescopio in telescopi %}
                    <tr>
                        <td>{{ telescopio.id }}</td>
                        <td>{{ telescopio.nome }}</td>
                        <td>{{ telescopio.posizione }}</td>
                        <td>{{ telescopio.apertura }}</td>
                        <td>{{ telescopio.tipo }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <a class="btn btn-primary" href="/">Torna a Home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
