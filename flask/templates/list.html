<!DOCTYPE html>
<html>
<head>
    <title>All Entries</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>numero</th>
                    <th>numero_posti</th>
                    <th>prezzo</th>
                    <th>tipo</th>
                    <th>disponibile</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in entries %}
                    <tr>
                        <td>{{ entry.numero }}</td>
                        <td>{{ entry.numero_posti }}</td>
                        <td>{{ entry.prezzo }}</td>
                        <td>{{ entry.tipo }}</td>
                        <td>{% if entry.disponibile == 1 %}Disponibile{% else %}Ocuppata{% endif %}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <h2>Camere disponibili</h2>
        <form method="POST" action="{{ url_for('view_rooms') }}">
            <label for="numero_posti">Numero Posti:</label>
            <input type="number" id="numero_posti" name="numero_posti">
            <label for="disponibile">Disponibile:</label>
            <input type="checkbox" id="disponibile" name="disponibile" value="1">
            <p>
                <input type="submit" value="Submit">
            </p>
        </form>
        <p>
            <a href="{{ url_for('view_rooms') }}"><button>View Rooms</button></a>
        </p>
</body>
</html>
